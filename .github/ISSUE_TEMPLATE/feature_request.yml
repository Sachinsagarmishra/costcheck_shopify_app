name: Feature request
description: Suggest an idea to make CostCheck more useful
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: I have 2,000 products from 15 suppliers and…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle this today?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project
      options:
        - label: This doesn't need storefront code, tracking, or storing product/customer data
